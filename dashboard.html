<!-- Vista: Dashboard Principal (Hub de Secciones) -->
<section class="view-container animate-fade-in dashboard-hub">
    <!-- SVG Defs con Filtros Neón y Gradientes Metálicos compartidos -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
        <defs>
            <!-- Filtro de Resplandor Neón Cian -->
            <filter id="neon-glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
                <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#38bdf8" flood-opacity="0.95" />
                <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#0284c7" flood-opacity="0.6" />
                <feMerge>
                    <feMergeNode />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- Gradiente Acero Brillante (Biseles superiores) -->
            <linearGradient id="metal-steel-light" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="25%" stop-color="#e2e8f0" />
                <stop offset="50%" stop-color="#94a3b8" />
                <stop offset="75%" stop-color="#64748b" />
                <stop offset="100%" stop-color="#334155" />
            </linearGradient>

            <!-- Gradiente Acero Oscuro / Carbón (Biseles inferiores) -->
            <linearGradient id="metal-steel-dark" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#64748b" />
                <stop offset="50%" stop-color="#334155" />
                <stop offset="100%" stop-color="#0f172a" />
            </linearGradient>

            <!-- Gradiente Neón Cian -->
            <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7dd3fc" />
                <stop offset="50%" stop-color="#38bdf8" />
                <stop offset="100%" stop-color="#0284c7" />
            </linearGradient>
        </defs>
    </svg>

    <!-- Barra de Estado Superior -->
    <div class="hub-header-bar">
        <span class="hub-tag">PANEL CENTRAL</span>
        <span id="dbStatusBadge" class="status-indicator">Conectando...</span>
    </div>

    <!-- Rejilla de Botones Cuadrados (2 Columnas, Varias Filas) -->
    <div class="modules-grid">
        <!-- 1. Botón Cuadrado: Peso y Salud -->
        <button class="module-btn" id="btn-mod-salud" onclick="window.abrirModalPeso?.()" aria-label="Abrir módulo de Peso y Salud">
            <div class="module-btn-corner"></div>
            <div class="module-icon-wrap">
                <svg viewBox="0 0 100 100" class="module-svg">
                    <!-- Resplandor Neón Cian de fondo -->
                    <path d="M 50,82 L 20,52 C 10,42 10,24 24,16 C 35,9 45,18 50,26 C 55,18 65,9 76,16 C 90,24 90,42 80,52 Z" 
                          fill="none" stroke="#38bdf8" stroke-width="5" filter="url(#neon-glow-cyan)" />
                    <!-- Estructura Acero Biselado: Corazón Geométrico -->
                    <path d="M 50,82 L 20,52 C 10,42 10,24 24,16 C 35,9 45,18 50,26 C 55,18 65,9 76,16 C 90,24 90,42 80,52 Z" 
                          fill="none" stroke="url(#metal-steel-light)" stroke-width="4" stroke-linejoin="round" />
                    <!-- Pulso ECG en Acero & Neón -->
                    <polyline points="15,48 35,48 42,32 50,64 58,40 65,48 85,48" 
                              fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#neon-glow-cyan)" stroke-linecap="round" stroke-linejoin="round" />
                    <polyline points="15,48 35,48 42,32 50,64 58,40 65,48 85,48" 
                              fill="none" stroke="url(#metal-steel-light)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="module-btn-info">
                <h3 class="module-title">Salud & Peso</h3>
                <span id="ultimoPesoDisplay" class="module-data-badge">Cargando...</span>
            </div>
        </button>

        <!-- 2. Botón Cuadrado: Gimnasio & Rutinas -->
        <button class="module-btn" id="btn-mod-gimnasio" onclick="window.router.cargarVista('gimnasio')" aria-label="Abrir módulo de Gimnasio">
            <div class="module-btn-corner"></div>
            <div class="module-icon-wrap">
                <svg viewBox="0 0 100 100" class="module-svg">
                    <!-- Resplandor Neón Cian: Mancuerna en diagonal (estilo logo principal) -->
                    <g filter="url(#neon-glow-cyan)">
                        <line x1="22" y1="78" x2="78" y2="22" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" />
                        <!-- Discos inferiores -->
                        <line x1="18" y1="62" x2="38" y2="82" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
                        <line x1="12" y1="68" x2="32" y2="88" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
                        <!-- Discos superiores -->
                        <line x1="62" y1="18" x2="82" y2="38" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
                        <line x1="68" y1="12" x2="88" y2="32" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
                    </g>
                    <!-- Estructura Acero Biselado -->
                    <line x1="22" y1="78" x2="78" y2="22" stroke="url(#metal-steel-light)" stroke-width="4.5" stroke-linecap="round" />
                    <!-- Collarín central moleteado -->
                    <rect x="44" y="44" width="12" height="12" rx="2" transform="rotate(45 50 50)" fill="url(#metal-steel-light)" />
                    <!-- Discos en Acero -->
                    <line x1="18" y1="62" x2="38" y2="82" stroke="url(#metal-steel-light)" stroke-width="5" stroke-linecap="round" />
                    <line x1="12" y1="68" x2="32" y2="88" stroke="url(#metal-steel-light)" stroke-width="4" stroke-linecap="round" />
                    <line x1="62" y1="18" x2="82" y2="38" stroke="url(#metal-steel-light)" stroke-width="5" stroke-linecap="round" />
                    <line x1="68" y1="12" x2="88" y2="32" stroke="url(#metal-steel-light)" stroke-width="4" stroke-linecap="round" />
                </svg>
            </div>
            <div class="module-btn-info">
                <h3 class="module-title">Gimnasio</h3>
                <span class="module-data-badge">Rutinas & Series</span>
            </div>
        </button>

        <!-- 3. Botón Cuadrado: Nutrición & Macros -->
        <button class="module-btn" id="btn-mod-nutricion" onclick="window.router.cargarVista('nutricion')" aria-label="Abrir módulo de Nutrición">
            <div class="module-btn-corner"></div>
            <div class="module-icon-wrap">
                <svg viewBox="0 0 100 100" class="module-svg">
                    <!-- Resplandor Neón Cian: Manzana Geométrica & Hoja -->
                    <g filter="url(#neon-glow-cyan)">
                        <path d="M 50,34 C 42,20 20,22 20,44 C 20,68 40,82 50,86 C 60,82 80,68 80,44 C 80,22 58,20 50,34 Z" 
                              fill="none" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" />
                        <path d="M 50,28 C 50,14 62,10 68,12 C 68,20 58,28 50,28 Z" 
                              fill="#38bdf8" />
                    </g>
                    <!-- Estructura Acero Biselado -->
                    <path d="M 50,34 C 42,20 20,22 20,44 C 20,68 40,82 50,86 C 60,82 80,68 80,44 C 80,22 58,20 50,34 Z" 
                          fill="none" stroke="url(#metal-steel-light)" stroke-width="3.5" stroke-linejoin="round" />
                    <path d="M 50,28 C 50,14 62,10 68,12 C 68,20 58,28 50,28 Z" 
                          fill="url(#metal-steel-light)" stroke="url(#metal-steel-dark)" stroke-width="1.5" />
                    <!-- Núcleo de Calorías/Energía -->
                    <circle cx="50" cy="54" r="8" fill="url(#metal-steel-light)" filter="url(#neon-glow-cyan)" />
                </svg>
            </div>
            <div class="module-btn-info">
                <h3 class="module-title">Nutrición</h3>
                <span class="module-data-badge">Calorías & Macros</span>
            </div>
        </button>

        <!-- 4. Botón Cuadrado: Diario de Progreso -->
        <button class="module-btn" id="btn-mod-diario" onclick="window.router.cargarVista('diario')" aria-label="Abrir módulo de Diario">
            <div class="module-btn-corner"></div>
            <div class="module-icon-wrap">
                <svg viewBox="0 0 100 100" class="module-svg">
                    <!-- Resplandor Neón Cian: Cuaderno & Gráfico -->
                    <g filter="url(#neon-glow-cyan)">
                        <rect x="22" y="18" width="56" height="66" rx="8" fill="none" stroke="#38bdf8" stroke-width="4.5" />
                        <line x1="32" y1="34" x2="68" y2="34" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
                        <polyline points="32,64 44,52 54,58 68,44" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                    </g>
                    <!-- Estructura Acero Biselado -->
                    <rect x="22" y="18" width="56" height="66" rx="8" fill="none" stroke="url(#metal-steel-light)" stroke-width="3" />
                    <line x1="32" y1="34" x2="68" y2="34" stroke="url(#metal-steel-light)" stroke-width="2.5" stroke-linecap="round" />
                    <polyline points="32,64 44,52 54,58 68,44" fill="none" stroke="url(#metal-steel-light)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    <!-- Anillas de Acero Izquierda -->
                    <circle cx="22" cy="30" r="3" fill="url(#metal-steel-light)" />
                    <circle cx="22" cy="50" r="3" fill="url(#metal-steel-light)" />
                    <circle cx="22" cy="70" r="3" fill="url(#metal-steel-light)" />
                </svg>
            </div>
            <div class="module-btn-info">
                <h3 class="module-title">Diario</h3>
                <span class="module-data-badge">Notas & Fatiga</span>
            </div>
        </button>

        <!-- 5. Botón Cuadrado: AI Coach -->
        <button class="module-btn" id="btn-mod-coach" onclick="window.router.cargarVista('coach')" aria-label="Abrir módulo de Coach">
            <div class="module-btn-corner"></div>
            <div class="module-icon-wrap">
                <svg viewBox="0 0 100 100" class="module-svg">
                    <!-- Resplandor Neón Cian: Rayo & Núcleo Hexagonal -->
                    <g filter="url(#neon-glow-cyan)">
                        <polygon points="50,12 84,30 84,70 50,88 16,70 16,30" fill="none" stroke="#38bdf8" stroke-width="4" />
                        <polygon points="54,22 34,50 48,50 44,78 66,44 52,44" fill="#38bdf8" />
                    </g>
                    <!-- Estructura Acero Biselado -->
                    <polygon points="50,12 84,30 84,70 50,88 16,70 16,30" fill="none" stroke="url(#metal-steel-light)" stroke-width="2.5" />
                    <polygon points="54,22 34,50 48,50 44,78 66,44 52,44" fill="url(#metal-steel-light)" stroke="url(#metal-steel-dark)" stroke-width="1.5" />
                </svg>
            </div>
            <div class="module-btn-info">
                <h3 class="module-title">AI Coach</h3>
                <span class="module-data-badge">Sobrecarga IA</span>
            </div>
        </button>

        <!-- 6. Botón Cuadrado: Espacio Disponible / Ampliaciones Futuras -->
        <button class="module-btn module-btn-future" onclick="window.mostrarAvisoFuturo?.()" aria-label="Módulo para futuras ampliaciones">
            <div class="module-btn-corner"></div>
            <div class="module-icon-wrap">
                <svg viewBox="0 0 100 100" class="module-svg">
                    <!-- Resplandor Neón Sutil: Hexágono Ranurado & Plus -->
                    <polygon points="50,16 80,33 80,67 50,84 20,67 20,33" 
                             fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" filter="url(#neon-glow-cyan)" />
                    <!-- Símbolo Más (+) en Acero -->
                    <line x1="50" y1="36" x2="50" y2="64" stroke="url(#metal-steel-light)" stroke-width="4.5" stroke-linecap="round" />
                    <line x1="36" y1="50" x2="64" y2="50" stroke="url(#metal-steel-light)" stroke-width="4.5" stroke-linecap="round" />
                </svg>
            </div>
            <div class="module-btn-info">
                <h3 class="module-title">+ Nuevo</h3>
                <span class="module-data-badge badge-future">Espacio Libre</span>
            </div>
        </button>
    </div>
</section>

<!-- MODAL REGISTRO DE PESO Y SALUD (Accesible desde el botón cuadrado de Salud) -->
<div id="modal-registro-peso" class="modal-overlay" onclick="window.cerrarModalPeso?.()">
    <div class="modal-card modal-industrial" onclick="event.stopPropagation()">
        <div class="modal-header">
            <div class="modal-title-group">
                <span class="modal-tag">SEGUIMIENTO BIOMÉTRICO</span>
                <h3>Peso y Salud</h3>
            </div>
            <button class="modal-close-btn" onclick="window.cerrarModalPeso?.()">✕</button>
        </div>

        <div class="modal-body">
            <div class="weight-display-box">
                <span class="weight-label">Último peso registrado:</span>
                <p id="ultimoPesoDisplayModal" class="weight-value">Cargando...</p>
            </div>

            <div class="input-group weight-input-group">
                <input type="number" id="pesoInput" step="0.1" min="30" max="300" placeholder="Ej: 75.5" autocomplete="off" inputmode="decimal">
                <button id="btnGuardarPeso" class="btn-primary">Guardar</button>
            </div>

            <p id="pesoFeedback" class="feedback-msg"></p>
        </div>

        <div class="modal-footer">
            <button class="btn-ghost" style="width: 100%;" onclick="window.cerrarModalPeso?.()">Cerrar</button>
        </div>
    </div>
</div>
