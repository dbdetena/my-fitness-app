<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel Fitness</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi Panel Fitness</h1>
        <p class="subtitle">Control diario de salud, nutrición y entrenamiento</p>
    </header>

    <main class="dashboard">
        <!-- Tarjeta 1: Peso y Salud -->
        <section class="card" onclick="alert('Módulo de Peso y Salud próximamente')">
            <div class="icon">⚖️</div>
            <h2>Peso y Salud</h2>
            <p>Sincronización y registro diario</p>
        </section>

        <!-- Tarjeta 2: Nutrición y Calorías -->
        <section class="card" onclick="alert('Módulo de Nutrición próximamente')">
            <div class="icon">🥗</div>
            <h2>Nutrición</h2>
            <p>Conteo rápido de calorías y macros</p>
        </section>

        <!-- Tarjeta 3: Gimnasio y Series -->
        <section class="card" onclick="alert('Módulo de Gimnasio próximamente')">
            <div class="icon">💪</div>
            <h2>Gimnasio</h2>
            <p>Sobrecarga progresiva y series</p>
        </section>

        <!-- Tarjeta 4: Resumen Diario -->
        <section class="card" onclick="alert('Balance energético próximamente')">
            <div class="icon">📊</div>
            <h2>Balance Diario</h2>
            <p>Calorías consumidas vs quemadas</p>
        </section>
    </main>

    <footer>
        <p>FitnessPersonalDBdT conectado</p>
    </footer>
</body>
</html>
