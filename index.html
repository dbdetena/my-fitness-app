<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mi Panel Fitness</title>

    <!-- Enlaces directos para iconos en Android y navegadores móviles -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon.png">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="apple-touch-icon-precomposed" href="./icon.png">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Cabecera principal -->
    <header class="app-header">
        <h1>Mi Panel Fitness</h1>
        <p id="view-subtitle" class="subtitle">Control diario de salud, nutrición y entrenamiento</p>
    </header>

    <!-- Contenedor dinámico SPA -->
    <main id="app-content" class="app-content">
        <!-- Las vistas parciales se inyectan aquí dinámicamente mediante router.js -->
    </main>

    <!-- Barra de navegación inferior fija -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-view="dashboard" id="nav-dashboard">
            <span class="nav-icon">📊</span>
            <span class="nav-label">Hoy</span>
        </button>
        <button class="nav-item" data-view="gimnasio" id="nav-gimnasio">
            <span class="nav-icon">💪</span>
            <span class="nav-label">Rutinas</span>
        </button>
        <button class="nav-item" data-view="nutricion" id="nav-nutricion">
            <span class="nav-icon">🥗</span>
            <span class="nav-label">Nutrición</span>
        </button>
        <button class="nav-item" data-view="diario" id="nav-diario">
            <span class="nav-icon">📓</span>
            <span class="nav-label">Diario</span>
        </button>
        <button class="nav-item" data-view="coach" id="nav-coach">
            <span class="nav-icon">⚡</span>
            <span class="nav-label">Coach</span>
        </button>
    </nav>

    <!-- Registro del Service Worker para PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW registrado con éxito'))
            .catch(err => console.log('Error al registrar SW:', err));
        });
      }
    </script>

    <!-- Motor SPA y Módulos -->
    <script type="module" src="salud.js"></script>
    <script type="module" src="router.js"></script>
</body>
</html>
