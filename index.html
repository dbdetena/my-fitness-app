<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel Fitness</title>

    <!-- Configuración para PWA / Icono en pantalla de inicio -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png?v=2">
    <meta name="theme-color" content="#0f172a">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Mi Panel Fitness</h1>
        <p class="subtitle">Control diario de salud, nutrición y entrenamiento</p>
    </header>

    <main class="dashboard">
        <!-- Tarjeta 1: Peso y Salud -->
        <section class="card active-card">
            <div class="icon">⚖️</div>
            <h2>Peso y Salud</h2>
            <p id="ultimoPesoDisplay">Cargando último peso...</p>
            <div class="input-group" style="margin-top: 12px; display: flex; gap: 8px; width: 100%;">
                <input type="number" id="pesoInput" step="0.1" placeholder="Ej: 75.5" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff;">
                <button onclick="guardarPeso()" style="padding: 10px 16px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer;">Guardar</button>
            </div>
        </section>

        <!-- Tarjeta 2: Nutrición y Calorías -->
        <section class="card" onclick="alert('Módulo de Nutrición próximamente')">
            <div class="icon">🥗</div>
            <h2>Nutrición</h2>
            <p>Conteo rápido de calorías y macros</p>
        </section>

        <!-- Tarjeta 3: Gimnasio y Series -->
        <section class="card" onclick="alert('Módulo de Gimnasio próximamente')">
            <div class="icon">💪</div>
            <h2>Gimnasio</h2>
            <p>Sobrecarga progresiva y series</p>
        </section>

        <!-- Tarjeta 4: Resumen Diario -->
        <section class="card" onclick="alert('Balance energético próximamente')">
            <div class="icon">📊</div>
            <h2>Balance Diario</h2>
            <p>Calorías consumidas vs quemadas</p>
        </section>
    </main>

    <footer>
        <p>FitnessPersonalDBdT conectado</p>
    </footer>

    <!-- Scripts principales -->
    <script type="module" src="salud.js"></script>
</body>
</html>
