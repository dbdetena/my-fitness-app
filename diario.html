<!-- Vista: Diario de Entrenamiento & Cuaderno de Bitácora -->
<section class="view-container animate-fade-in bitacora-view">
    
    <!-- CABECERA DEL DIARIO DE NOTAS -->
    <div class="bitacora-header">
        <div class="bitacora-title-wrap">
            <div class="bitacora-emblem-badge">
                <span>📖</span>
                <span>Diario Oficial</span>
            </div>
            <h2>Diario de Notas</h2>
        </div>

        <!-- Estadísticas Rápidas -->
        <div class="bitacora-stats-grid">
            <div class="stat-pill card-carbon">
                <span class="stat-num" id="stat-total-entradas">0</span>
                <span class="stat-desc">Notas Totales</span>
            </div>
            <div class="stat-pill card-carbon">
                <span class="stat-num stat-gold" id="stat-post-entreno">0</span>
                <span class="stat-desc">Post-Sesiones</span>
            </div>
            <div class="stat-pill card-carbon">
                <span class="stat-num stat-cyan" id="stat-por-voz">0</span>
                <span class="stat-desc">Por Voz 🎙️</span>
            </div>
        </div>
    </div>

    <!-- COMPOSITOR DE NUEVA NOTA (A VOLUNTAD) -->
    <div class="card card-carbon bitacora-composer-card">
        <div class="composer-header">
            <div class="composer-title-row">
                <span class="composer-icon">✍️</span>
                <div>
                    <h4>Añadir Nota al Diario</h4>
                    <span class="live-clock-badge">🕒 Fecha y hora automáticas en cada registro</span>
                </div>
            </div>

            <!-- Selector de Categoría -->
            <div class="composer-category-select">
                <select id="select-bitacora-categoria" class="custom-select-input">
                    <option value="general">📝 Nota Libre / Reflexión</option>
                    <option value="recuperacion">⚡ Energía, Sueño & Descanso</option>
                    <option value="post-entreno">🏋️ Resumen de Entrenamiento</option>
                    <option value="molestia">🚨 Alerta / Incidencia / Molestia</option>
                    <option value="nutricion">🥗 Nutrición & Hidratación</option>
                </select>
            </div>
        </div>

        <div class="composer-body">
            <textarea id="input-bitacora-texto" class="bitacora-textarea" placeholder="Escribe o pulsa el botón de micrófono para dictar por voz tus sensaciones, energía, fatiga, incidencias o impresiones..."></textarea>
        </div>

        <!-- SELECTOR RPE: CILINDRO HORIZONTAL 3D (0 al 10) -->
        <div class="rpe-cylinder-section">
            <div class="rpe-cylinder-header-row">
                <div class="rpe-cylinder-title-wrap">
                    <span class="rpe-cylinder-title">Esfuerzo (RPE)</span>
                    <span class="rpe-cylinder-subtitle">(0=Nulo, 10=Fallo)</span>
                </div>
                <span class="rpe-cylinder-current-badge" id="rpe-cylinder-badge">RPE 8</span>
            </div>
            
            <div class="rpe-cylinder-stage">
                <div class="rpe-cylinder-container" id="rpe-cylinder-scroll" tabindex="0" role="slider" aria-label="Selector de RPE" aria-valuemin="0" aria-valuemax="10" aria-valuenow="8">
                    <div class="rpe-cylinder-item" data-val="0">0</div>
                    <div class="rpe-cylinder-item" data-val="1">1</div>
                    <div class="rpe-cylinder-item" data-val="2">2</div>
                    <div class="rpe-cylinder-item" data-val="3">3</div>
                    <div class="rpe-cylinder-item" data-val="4">4</div>
                    <div class="rpe-cylinder-item" data-val="5">5</div>
                    <div class="rpe-cylinder-item" data-val="6">6</div>
                    <div class="rpe-cylinder-item" data-val="7">7</div>
                    <div class="rpe-cylinder-item active" data-val="8">8</div>
                    <div class="rpe-cylinder-item" data-val="9">9</div>
                    <div class="rpe-cylinder-item" data-val="10">10</div>
                </div>
                <div class="rpe-cylinder-center-marker"></div>
            </div>
            <input type="hidden" id="input-bitacora-rpe" value="8">
        </div>

        <div class="composer-footer">
            <div class="composer-left-actions">
                <!-- Botón de Transcripción por Voz -->
                <button type="button" id="btn-dictar-voz" class="btn-voice-dictate" onclick="window.diario?.alternarGrabacionVoz('input-bitacora-texto', 'btn-dictar-voz')">
                    <span>🎙️ Dictar por voz</span>
                </button>
            </div>

            <button type="button" class="btn-neon-cyan btn-save-note" onclick="window.diario?.registrarNotaManual()">
                <span>💾 Guardar en Diario</span>
            </button>
        </div>
    </div>

    <!-- FILTROS Y TIMELINE DEL DIARIO -->
    <div class="bitacora-timeline-section">
        <div class="timeline-header-bar">
            <div class="timeline-title-group">
                <h3>Historial de Entradas</h3>
                <span class="timeline-hint">Supervisión acumulada para IA</span>
            </div>

            <div class="bitacora-filters-row single-line-filters">
                <button class="bitacora-filter-chip active" data-filtro="todos" onclick="window.diario?.setFiltro('todos')">Todas</button>
                <button class="bitacora-filter-chip" data-filtro="post-entreno" onclick="window.diario?.setFiltro('post-entreno')">🏋️ Entrenos</button>
                <button class="bitacora-filter-chip" data-filtro="molestia" onclick="window.diario?.setFiltro('molestia')">🚨 Alertas</button>
            </div>
        </div>

        <!-- Contenedor dinámico de notas de la bitácora -->
        <div id="contenedor-entradas-bitacora" class="bitacora-entries-stream">
            <!-- Entradas inyectadas por diario.js -->
        </div>
    </div>

</section>
