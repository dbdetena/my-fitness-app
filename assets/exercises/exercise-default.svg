<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo oscuro industrial -->
  <rect width="400" height="300" rx="12" fill="url(#bgGrad)"/>

  <!-- Cuadrícula biomecánica sutil -->
  <path d="M 0 50 L 400 50 M 0 100 L 400 100 M 0 150 L 400 150 M 0 200 L 400 200 M 0 250 L 400 250" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M 50 0 L 50 300 M 100 0 L 100 300 M 150 0 L 150 300 M 200 0 L 200 300 M 250 0 L 250 300 M 300 0 L 300 300 M 350 0 L 350 300" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Órbitas y nodos biomecánicos 3D -->
  <circle cx="200" cy="150" r="110" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="4,8" stroke-opacity="0.35"/>
  <circle cx="200" cy="150" r="75" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="2,6" stroke-opacity="0.25"/>

  <!-- Silueta Anatómica Neón -->
  <g filter="url(#glow)">
    <!-- Cabeza -->
    <ellipse cx="200" cy="65" rx="14" ry="17" fill="none" stroke="url(#neonCyan)" stroke-width="2.5"/>
    <circle cx="200" cy="65" r="4" fill="#38bdf8" opacity="0.6"/>

    <!-- Cuello y Columna -->
    <line x1="200" y1="82" x2="200" y2="105" stroke="url(#neonCyan)" stroke-width="3"/>
    <line x1="200" y1="105" x2="200" y2="160" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="3,3"/>

    <!-- Cintura Escapular & Pecho -->
    <path d="M 160 105 L 200 102 L 240 105" fill="none" stroke="url(#neonCyan)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 175 110 Q 200 125 225 110" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <path d="M 180 128 Q 200 138 220 128" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

    <!-- Brazos con articulaciones -->
    <circle cx="160" cy="105" r="4.5" fill="#38bdf8"/>
    <circle cx="240" cy="105" r="4.5" fill="#38bdf8"/>

    <!-- Brazo Izquierdo -->
    <line x1="160" y1="105" x2="140" y2="142" stroke="url(#neonCyan)" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="140" cy="142" r="3.5" fill="#818cf8"/>
    <line x1="140" y1="142" x2="128" y2="175" stroke="url(#neonCyan)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="128" cy="175" r="2.5" fill="#38bdf8"/>

    <!-- Brazo Derecho -->
    <line x1="240" y1="105" x2="260" y2="142" stroke="url(#neonCyan)" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="260" cy="142" r="3.5" fill="#818cf8"/>
    <line x1="260" y1="142" x2="272" y2="175" stroke="url(#neonCyan)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="272" cy="175" r="2.5" fill="#38bdf8"/>

    <!-- Cintura y Pelvis -->
    <path d="M 182 160 L 200 165 L 218 160" fill="none" stroke="url(#neonPurple)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="182" cy="165" r="4" fill="#818cf8"/>
    <circle cx="218" cy="165" r="4" fill="#818cf8"/>

    <!-- Pierna Izquierda -->
    <line x1="182" y1="165" x2="172" y2="218" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="172" cy="218" r="4" fill="#38bdf8"/>
    <line x1="172" y1="218" x2="168" y2="270" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 168 270 L 158 274" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pierna Derecha -->
    <line x1="218" y1="165" x2="228" y2="218" stroke="url(#neonCyan)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="228" cy="218" r="4" fill="#38bdf8"/>
    <line x1="228" y1="218" x2="232" y2="270" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 232 270 L 242 274" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Líneas de vector de fuerza biomecánica -->
  <line x1="100" y1="220" x2="135" y2="185" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
  <line x1="300" y1="220" x2="265" y2="185" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Logo/Texto HUD Estilizado -->
  <text x="200" y="290" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="3" opacity="0.8">ANATOMÍA 3D • GUÍA BIOMECÁNICA</text>
</svg>
